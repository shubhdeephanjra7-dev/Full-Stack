# All secrets come from environment variables (or backend/.env, see .env.example).
spring:
  application:
    name: skillmate
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skillmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none        # schema is owned by Flyway migrations
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
skillmate:
  jwt:
    secret: ${JWT_SECRET}                              # >= 32 characters, required
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cookie:
    secure: ${COOKIE_SECURE:false}                      # set true when served over HTTPS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:                                                # optional first-admin bootstrap
    email: ${SKILLMATE_ADMIN_EMAIL:}
    password: ${SKILLMATE_ADMIN_PASSWORD:}
    name: ${SKILLMATE_ADMIN_NAME:Administrator}
